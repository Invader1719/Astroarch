  services:
    db:
      image: postgres:16
      container_name: astro_db
      environment:
        POSTGRES_DB: ${POSTGRES_DB:-astrodb}
        POSTGRES_USER: ${POSTGRES_USER:-postgres}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ports:
        - "5432:5432"
      volumes:
        - pg_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-astrodb}"]
        interval: 5s
        timeout: 5s
        retries: 10

    backend:
      container_name: astro_backend
      build:
        context: ./backend
        dockerfile: Dockerfile
      environment:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/astrodb
        ENV: dev
      depends_on:
        db:
          condition: service_healthy
      ports:
        - "8001:8000"
      volumes:
        - ./backend:/app
      command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

    frontend:
      container_name: astro_frontend
      build:
        context: ./frontend
        dockerfile: Dockerfile
      environment:
        CHOKIDAR_USEPOLLING: "true"
        VITE_API_URL: /api
      depends_on:
        - backend
      ports:
        - "5173:5173"
      volumes:
        - ./frontend:/usr/src/app
        - /usr/src/app/node_modules
      command: npm run dev -- --host

  volumes:
    pg_data:
